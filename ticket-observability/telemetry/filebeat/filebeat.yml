
filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log

processors:

  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
  # only keep logs from our app
  - drop_event:
      when:
        not:
          equals:
            container.name: "ticket-app"

  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
